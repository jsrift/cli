name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Installs the published `jsrift` engine; the command has no other
      # runtime dependency.
      - run: npm ci

      - run: npm run typecheck

      - run: npm run build
